<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
:root {
  color-scheme: light;
  --shell:500px;
  --paper:#f5f3ef; --surface:#ffffff; --raise:#faf9f6;
  --ink:#1a1c1f; --muted:#6b6d73; --line:#e4e1db;
  --kept:#2f6248; --due:#9a6410; --broken:#97322a;
  --kept-bg:#e8f0eb; --due-bg:#f7eedd; --broken-bg:#f7e7e4;
  --ui:"Public Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { color-scheme: dark;
    --paper:#111317; --surface:#1c1f24; --raise:#22262c;
    --ink:#e8e6e1; --muted:#979aa1; --line:#2b2f36;
    --kept:#63a184; --due:#cf9a45; --broken:#cf6f61;
    --kept-bg:#1b2a23; --due-bg:#2b2318; --broken-bg:#2c1d1b; }
}
:root[data-theme="dark"] { color-scheme: dark;
  --paper:#111317; --surface:#1c1f24; --raise:#22262c;
  --ink:#e8e6e1; --muted:#979aa1; --line:#2b2f36;
  --kept:#63a184; --due:#cf9a45; --broken:#cf6f61;
  --kept-bg:#1b2a23; --due-bg:#2b2318; --broken-bg:#2c1d1b; }

* { box-sizing:border-box; }
html, body { height:100%; }
body { margin:0; background:var(--paper); color:var(--ink); font-family:var(--ui);
       font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
       -webkit-text-size-adjust:100%; }
.app { max-width:var(--shell); margin:0 auto; }
main { padding:22px 16px 132px; }

/* header */
/* Kepala dan baris modul menempel sebagai satu blok. Dulu keduanya menempel sendiri-sendiri
   dan yang bawah perlu tahu tinggi yang atas — padahal tingginya berubah ikut lebar layar,
   jadi di satu lebar tertentu baris modulnya selalu tersembunyi di balik kepalanya. */
.chrome { position:sticky; top:env(safe-area-inset-top,0px); z-index:30; }
.top { background:color-mix(in srgb,var(--paper) 94%,transparent); backdrop-filter:blur(10px);
       border-bottom:1px solid var(--line); }
.top-in { max-width:var(--shell); margin:0 auto; padding:11px 16px; display:flex;
          align-items:center; gap:10px; }
.logo { display:block; text-align:left; padding:0; border:0; background:none; color:inherit;
        font:inherit; cursor:pointer; }
.logo .brand { display:block; font-weight:700; letter-spacing:.14em; font-size:13px; }
.logo .tagline { display:block; font-size:9.5px; letter-spacing:.07em; color:var(--muted);
                 text-transform:uppercase; margin-top:1px; white-space:nowrap; }
.logo:hover .tagline { color:var(--ink); }

/* baris modul: di mana kamu sekarang, dan jalan keluarnya */
.modbar { background:var(--surface); border-bottom:1px solid var(--line); }
.modbar-in { max-width:var(--shell); margin:0 auto; padding:8px 16px; display:flex;
             align-items:center; gap:10px; font-size:13px; }
.modbar b { font-weight:600; letter-spacing:.06em; }
.modbar .back, .modbar .what { background:none; border:0; padding:0; cursor:pointer;
             font:inherit; color:var(--muted); }
.modbar .back:hover, .modbar .what:hover { color:var(--ink); }
.modbar .what { margin-left:auto; text-decoration:underline; text-underline-offset:2px; }

/* katalog modul */
.mods { display:grid; gap:12px; }
.mod { width:100%; text-align:left; display:block; background:var(--surface); color:inherit;
       border:1px solid var(--line); border-radius:14px; padding:16px; font:inherit; }
button.mod { cursor:pointer; }
button.mod:hover { border-color:var(--ink); }
.mod .head { display:flex; align-items:baseline; gap:9px; }
.mod .name { font-weight:700; letter-spacing:.1em; font-size:15px; }
.mod .full { color:var(--muted); font-size:12.5px; }
.mod .pill { margin-left:auto; font-size:11px; letter-spacing:.04em; padding:2px 8px;
             border-radius:999px; background:var(--kept-bg); color:var(--kept); }
.mod.soon { opacity:.72; }
.mod.soon .pill { background:var(--raise); color:var(--muted); }
.mod p { margin:7px 0 0; font-size:13.5px; color:var(--muted); }
.mod .state { margin-top:10px; font-size:13px; font-weight:500; display:flex;
              align-items:center; gap:7px; }
.mod .state i { width:7px; height:7px; border-radius:50%; background:var(--muted); flex:none; }
.mod .state.todo i { background:var(--due); }
.mod .state.done i { background:var(--kept); }

/* penjelasan modul */
.intro h2 { font-size:14px; margin:22px 0 7px; }
.intro ol, .intro ul { margin:0; padding-left:20px; }
.intro li { margin:5px 0; font-size:14.5px; }
.intro .lead { font-size:15px; }
.when { margin-left:auto; font-family:var(--mono); font-size:12px; color:var(--muted);
        text-align:right; }
.theme { width:30px; height:30px; border-radius:50%; flex:none; cursor:pointer;
          font-size:14px; line-height:1; background:var(--surface); color:var(--muted);
          border:1px solid var(--line); display:grid; place-items:center; padding:0; }
.theme:hover { color:var(--ink); border-color:var(--ink); }
.avatar { width:30px; height:30px; border-radius:50%; background:var(--ink); color:var(--paper);
          display:grid; place-items:center; font-size:12px; font-weight:700; flex:none; }

/* progress */
.prog { display:flex; gap:6px; margin-bottom:20px; }
.prog i { height:4px; flex:1; border-radius:2px; background:var(--line); }
.prog i.on { background:var(--ink); }
.stepno { font-family:var(--mono); font-size:11.5px; color:var(--muted); letter-spacing:.05em;
          margin-bottom:7px; }

h1 { font-size:23px; font-weight:700; letter-spacing:-.02em; margin:0 0 6px; text-wrap:balance; }
.sub { color:var(--muted); font-size:14.5px; margin:0 0 22px; }
.sub b { color:var(--ink); font-weight:600; }

/* the counting table */
.tbl { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px; }
table.mx { width:100%; border-collapse:separate; border-spacing:6px; margin:-6px; }
table.mx th { font-size:11px; font-weight:600; color:var(--muted); padding:0 0 2px;
              text-align:center; line-height:1.25; }
table.mx th:first-child { text-align:left; }
table.mx td:first-child { font-family:var(--mono); font-size:13.5px; font-weight:500; width:46px; }
table.mx input { width:100%; min-height:52px; font:inherit; font-size:19px; text-align:center;
  font-variant-numeric:tabular-nums; border:1px solid var(--line); border-radius:11px;
  background:var(--raise); color:var(--ink); padding:4px; }
table.mx input:focus { background:var(--surface); border-color:var(--ink); }
.legend { font-size:13px; color:var(--muted); margin:12px 0 0; }

.sumline { display:flex; gap:10px; margin-top:14px; }
.sumline div { flex:1; background:var(--raise); border:1px solid var(--line); border-radius:11px;
               padding:10px; text-align:center; }
.sumline b { display:block; font-family:var(--mono); font-size:22px; font-weight:500;
             line-height:1.15; font-variant-numeric:tabular-nums; }
.sumline span { font-size:11.5px; color:var(--muted); }
.sumline .w b { color:var(--broken); }

.lamp { display:flex; align-items:center; gap:9px; font-weight:600; font-size:15px;
        padding:13px 15px; border-radius:12px; border:1px solid var(--line); margin-bottom:18px; }
.lamp i { width:12px; height:12px; border-radius:50%; flex:none; }
.lamp.green { background:var(--kept-bg); color:var(--kept); } .lamp.green i { background:var(--kept); }
.lamp.amber { background:var(--due-bg); color:var(--due); }  .lamp.amber i { background:var(--due); }
.lamp.red { background:var(--broken-bg); color:var(--broken); } .lamp.red i { background:var(--broken); }

.fld { margin-bottom:22px; }
.fld label { display:block; font-size:16px; font-weight:600; margin-bottom:7px; }
.opt { font-weight:500; color:var(--muted); font-size:13.5px; }
.hint { display:block; font-weight:400; color:var(--muted); font-size:13.5px; margin-top:3px; }
textarea, input[type=date] { width:100%; font:inherit; font-size:16px; padding:12px 13px;
  border-radius:11px; border:1px solid var(--line); background:var(--surface); color:var(--ink); }
textarea { min-height:82px; resize:vertical; }
:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }

.check { display:flex; gap:12px; align-items:flex-start; background:var(--surface);
         border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:9px;
         cursor:pointer; }
.check input { width:22px; height:22px; margin:0; flex:none; accent-color:var(--kept); }
.check .t { font-size:15px; }
.check.decl { background:var(--raise); }
.check.decl .t { font-size:14px; line-height:1.5; }

/* review */
.rev { background:var(--surface); border:1px solid var(--line); border-radius:14px;
       overflow:hidden; margin-bottom:18px; }
.rev dl { margin:0; }
.rev div { display:flex; gap:14px; padding:12px 15px; border-top:1px solid var(--line); }
.rev div:first-child { border-top:0; }
.rev dt { flex:0 0 96px; font-size:13.5px; color:var(--muted); }
.rev dd { margin:0; flex:1; font-size:14.5px; }
.rev dd.n { font-family:var(--mono); font-variant-numeric:tabular-nums; }
.rev .edit { font:inherit; font-size:13px; font-weight:600; background:none; border:0;
             color:var(--ink); cursor:pointer; padding:0; text-decoration:underline;
             text-underline-offset:3px; }

/* done */
.done { text-align:center; padding:14px 0 6px; }
.done .tick { width:62px; height:62px; border-radius:50%; background:var(--kept-bg);
              color:var(--kept); display:grid; place-items:center; margin:0 auto 14px;
              font-size:31px; font-weight:700; }
.done h1 { margin-bottom:4px; }

.card { background:var(--surface); border:1px solid var(--line); border-radius:13px;
        padding:15px; margin-bottom:9px; }
.card.due { border-left:3px solid var(--due); }
.card.bad { border-left:3px solid var(--broken); background:var(--broken-bg); }
.row { display:flex; align-items:baseline; gap:9px; flex-wrap:wrap; }
.grow { flex:1 1 auto; }
.meta { font-family:var(--mono); font-size:11.5px; color:var(--muted); }
.strong { font-weight:600; }
h2 { font-size:11.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
     color:var(--muted); margin:28px 0 10px; }

.report { background:var(--raise); border:1px solid var(--line); border-radius:11px; padding:14px;
          font-family:var(--mono); font-size:12.5px; line-height:1.7; white-space:pre-wrap;
          word-break:break-word; text-align:left; }
.blank { border:1px dashed var(--line); border-radius:13px; padding:30px 18px; text-align:center;
         color:var(--muted); font-size:14.5px; background:var(--surface); }
.blank b { display:block; color:var(--ink); font-size:16px; margin-bottom:5px; }

.stats { display:flex; gap:9px; margin-bottom:8px; }
.stats div { flex:1; background:var(--surface); border:1px solid var(--line); border-radius:12px;
             padding:12px 10px; }
.stats b { display:block; font-family:var(--mono); font-size:22px; font-weight:500; line-height:1.15; }
.stats span { font-size:11.5px; color:var(--muted); }
.stats .g b { color:var(--kept); } .stats .r b { color:var(--broken); }

.tabs { display:flex; gap:24px; border-bottom:1px solid var(--line); padding-inline:16px;
        max-width:var(--shell); margin:0 auto; }
.tabs button { font:inherit; font-size:15px; font-weight:600; background:none; border:0;
               color:var(--muted); cursor:pointer; padding:13px 0 10px; margin-bottom:-1px;
               border-bottom:2px solid transparent; min-height:46px; }
.tabs button[aria-selected="true"] { color:var(--ink); border-bottom-color:var(--ink); }
.tabs .n { font-family:var(--mono); font-size:11px; margin-left:5px; color:var(--paper);
           background:var(--broken); border-radius:9px; padding:1px 6px; }

/* bottom bar */
.bar { position:fixed; left:0; right:0; bottom:0; z-index:40;
       background:color-mix(in srgb,var(--paper) 96%,transparent); backdrop-filter:blur(10px);
       border-top:1px solid var(--line);
       padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px)); }
.bar-in { max-width:var(--shell); margin:0 auto; }
.bar .err { color:var(--broken); font-size:14px; font-weight:600; margin-bottom:9px; }
.btns { display:flex; gap:9px; }
.btn { font:inherit; font-size:16px; font-weight:600; padding:14px 18px; border-radius:12px;
       cursor:pointer; border:1px solid var(--ink); background:var(--ink); color:var(--paper);
       min-height:52px; flex:1; }
.btn.sec { background:var(--surface); color:var(--ink); border-color:var(--line); flex:0 0 auto;
           min-width:96px; }
.saved { font-size:12.5px; color:var(--muted); text-align:center; margin-top:9px; }
.prow2 { position:relative; border:1px solid var(--line); border-radius:12px;
         padding:13px 13px 1px; margin-bottom:10px; background:var(--raise); }
.prow2 .fld { margin-bottom:12px; }
.prow2 textarea { min-height:60px; }
.drop { position:absolute; top:9px; right:9px; width:30px; height:30px; border-radius:50%;
        font:inherit; font-size:13px; line-height:1; cursor:pointer; color:var(--muted);
        background:var(--surface); border:1px solid var(--line); }
.drop:hover { color:var(--broken); border-color:var(--broken); }
.addplan { width:100%; padding:12px; font:inherit; font-size:14.5px; font-weight:600;
           color:var(--muted); background:none; border:1px dashed var(--line);
           border-radius:12px; cursor:pointer; }
.addplan:hover { color:var(--ink); border-color:var(--ink); }
.daynav { display:flex; align-items:center; justify-content:space-between; gap:10px;
          margin:0 0 14px; font-size:14px; }
.daynav b { font-weight:600; }
.daynav button { font:inherit; font-size:13.5px; color:var(--ink); background:var(--surface);
                 border:1px solid var(--line); border-radius:9px; padding:7px 11px; cursor:pointer; }
.daynav span { min-width:1px; }
.prow { display:flex; align-items:center; gap:9px; width:100%; padding:0; margin:0;
        font:inherit; text-align:left; color:inherit; background:none; border:0; cursor:pointer; }
.pip { flex:0 0 auto; width:9px; height:9px; border-radius:50%; background:var(--muted); }
.pip.green { background:var(--kept); } .pip.amber { background:var(--due); }
.pip.red { background:var(--broken); } .pip.off { background:var(--line); }
.chev { color:var(--muted); font-size:15px; }
.fix { display:block; width:100%; margin:14px 0 0; padding:11px; font:inherit; font-size:14px;
       color:var(--muted); background:none; border:1px dashed var(--line); border-radius:11px;
       cursor:pointer; }
.fix:hover { color:var(--ink); border-color:var(--ink); }
.miss { background:var(--broken-bg); border:1px solid var(--line);
         border-left:3px solid var(--broken); border-radius:11px; padding:12px 14px;
         font-size:14px; margin-bottom:20px; }
.note { font-size:12.5px; color:var(--muted); margin-top:28px; padding-top:14px;
        border-top:1px solid var(--line); }
@media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
/* Laptop. Telepon tetap satu kolom dengan tombol di bawah jempol; di layar lebar
   kolomnya melebar, kotak angkanya membesar, dan batang tombol ikut mengalir di akhir
   halaman — batang yang menempel di dasar layar lebar terasa terlepas dari isinya. */
@media (min-width:860px) {
  :root { --shell:720px; }
  main { padding:34px 24px 40px; }
  .top-in, .tabs { padding-inline:24px; }
  h1 { font-size:27px; }
  .tbl { padding:20px; }
  .tbl input { min-height:52px; font-size:17px; }
  .bar { position:static; background:none; backdrop-filter:none; border-top:0;
         padding:18px 24px 48px; }
  .bar-in { padding:0; }
  .btns { justify-content:flex-end; }
  .btn { flex:0 0 auto; min-width:190px; }
  .btn.sec { min-width:120px; }
  /* Rekap: yang perlu ditindak di kiri, seluruh tim di kanan — terbaca sekaligus
     tanpa menggulir, yang memang gunanya layar lebar buat seorang leader. */
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:0 28px; align-items:start; }
  .cols h2:first-child { margin-top:0; }
}

</style>

</div></div>

<script>
"use strict";

/* ============================================================================
   MESSI — Messenger Screening.

   Built to be answered on a phone, in the middle of doing something else, by
   someone who was never trained on it. One question per screen; the report
   format the team already knows is generated at the end rather than typed.
   ========================================================================== */

const TZ = "Asia/Jakarta";
const WORKDAYS = [1,2,3,4,5], FIRST_DAY = "2026-09-28", DRAFT = "messi.draft.";
const ID_DAY = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
const ID_SHORT = ["Min","Sen","Sel","Rab","Kam","Jum","Sab"];
const MON = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];

/* ---- konfigurasi --------------------------------------------------------- */
/* Pertanyaan, ambang, dan jamnya tidak lagi tertanam di sini: admin mengubahnya dari
   halaman Pertanyaan, dan server mengirimkannya lewat window.FURA_CONFIG. Bawaan di
   bawah ini tetap ada supaya halaman ini utuh tanpa server sama sekali — dan harus sama
   persis dengan messi_config_default() di lib/engine.php. Kalau keduanya berbeda, satu
   laporan akan divalidasi dengan dua aturan yang berlainan. */
const CFG_DEFAULT = {
  channels: [
    { key:"WAG", label:"WAG", full:"WhatsApp Group" },
    { key:"TGG", label:"TGG", full:"Telegram Group" },
    { key:"GCG", label:"GCG", full:"Google Chat" },
  ],
  team_name: "",
  threshold_days: 3,
  open_hour: 9,
  due_hour: 18,
  max_plans: 5,
  declaration:
    "Saya sudah memastikan semua channel yang saya pegang terkelola dengan baik tanpa " +
    "gantung, dan saya melaporkan laporan di atas dengan jujur sesuai kondisi sebenarnya.",
  questions: {
    grid: { label:"Berapa banyak hari ini?",
            hint:"Hitung channel yang kamu pegang. Gantung = ada yang nanya tapi belum dibalas." },
    detail: { label:"Yang mana saja?", placeholder:"WAG Klien A — belum dibalas 4 hari",
              error:"Tulis dulu yang mana saja yang gantung." },
    plan: { label:"Mau diapakan?", placeholder:"Balas setelah harga di-approve",
            error:"Tulis rencananya." },
    due: { label:"Kapan beres?",
           error:"Pilih tanggalnya. Tanpa tanggal, tidak ada yang bisa mengingatkan." },
    escalation: { label:"Ada yang perlu atasan tahu?",
                  hint:"Ini yang dibaca atasan. Angkanya sudah otomatis.",
                  placeholder:"Butuh approve harga Klien A", show:true },
    prista: { label:"Ada yang perlu jadi project?", placeholder:"Revisi jadwal Vendor B",
              show:true },
  },
};

const whole = (v, d, lo, hi) => {
  const n = parseInt(v, 10);
  return Number.isFinite(n) && n >= lo && n <= hi ? n : d;
};
function cfgOf(raw) {
  const d = CFG_DEFAULT, c = raw && typeof raw === "object" ? raw : {};
  const questions = {};
  for (const k of Object.keys(d.questions)) {
    questions[k] = { ...d.questions[k], ...(((c.questions || {})[k]) || {}) };
  }
  const channels = (Array.isArray(c.channels) ? c.channels : [])
    .filter(x => x && x.key).map(x => ({ key:String(x.key),
      label:String(x.label || x.key), full:String(x.full || x.label || x.key) }));
  return {
    channels: channels.length ? channels : d.channels,
    team_name: typeof c.team_name === "string" ? c.team_name : d.team_name,
    threshold_days: whole(c.threshold_days, d.threshold_days, 1, 90),
    open_hour: whole(c.open_hour, d.open_hour, 0, 23),
    due_hour:  whole(c.due_hour,  d.due_hour,  1, 24),
    max_plans: whole(c.max_plans, d.max_plans, 1, 20),
    declaration: typeof c.declaration === "string" && c.declaration.trim()
      ? c.declaration : d.declaration,
    questions,
  };
}
const CFG = cfgOf(window.FURA_CONFIG);
const Q = CFG.questions;
const CHANNELS = CFG.channels, DECLARATION = CFG.declaration;
const OPEN_AT = CFG.open_hour, DUE_AT = CFG.due_hour, MAX_PLANS = CFG.max_plans;
const NDAYS = CFG.threshold_days;
const hhmm = h => String(h).padStart(2, "0") + ":00";
const COLS = [
  { key:"open",  head:"Masih<br>aktif" },
  { key:"gt3",   head:`Gantung<br>&gt;${NDAYS} hari` },
  { key:"lt3",   head:`Gantung<br>&lt;${NDAYS} hari` },
  { key:"reply", head:"Sudah<br>dibalas" },
];

/* ---- katalog modul -------------------------------------------------------- */

const MODULES = [
  { key:"messi", name:"MESSI", full:"Messenger Screening", live:true,
    what:"Sapuan harian semua channel chat: berapa yang aktif, berapa yang gantung, " +
         "dan apa rencana untuk yang gantung." },

/* ---- tema ---------------------------------------------------------------- */
/* Bawaannya mengikuti perangkat. Begitu orang menekan tombolnya, pilihannya dikunci
   di perangkat itu saja — tidak ikut ke HP rekannya, dan tidak disimpan di server. */
const THEME = "messi.theme";
const prefersDark = () => window.matchMedia
  && window.matchMedia("(prefers-color-scheme: dark)").matches;
function readTheme() {
  try { return localStorage.getItem(THEME); } catch { return null; }   // mode privat
}
function applyTheme() {
  const t = readTheme();
  const root = document.documentElement;
  if (t) root.setAttribute("data-theme", t); else root.removeAttribute("data-theme");
  const dark = t ? t === "dark" : prefersDark();
  const btn = el("theme");
  if (btn) { btn.textContent = dark ? "☀" : "☾";
             btn.title = dark ? "Pakai tampilan terang" : "Pakai tampilan gelap"; }
}
function toggleTheme() {
  const t = readTheme();
  const next = (t ? t === "dark" : prefersDark()) ? "light" : "dark";
  try { localStorage.setItem(THEME, next); } catch { /* mode privat: sekali pakai saja */ }
  applyTheme();
}

/* ---- Jakarta clock ------------------------------------------------------- */
const parts = () => Object.fromEntries(new Intl.DateTimeFormat("en-GB",
  { timeZone:TZ, year:"numeric", month:"2-digit", day:"2-digit",
    hour:"2-digit", minute:"2-digit", hour12:false })
  .formatToParts(new Date()).map(x => [x.type, x.value]));
const today = () => { const p = parts(); return `${p.year}-${p.month}-${p.day}`; };
const nowHour = () => parseInt(parts().hour, 10);
const nowHM = () => { const p = parts(); return `${p.hour}:${p.minute}`; };

const d = s => new Date(s + "T00:00:00Z");
const iso = t => t.toISOString().slice(0,10);
const addDays = (s,n) => { const t = d(s); t.setUTCDate(t.getUTCDate()+n); return iso(t); };
const isWorkday = s => WORKDAYS.includes(d(s).getUTCDay());
const fmt = s => { const t = d(s); return `${ID_SHORT[t.getUTCDay()]} ${t.getUTCDate()} ${MON[t.getUTCMonth()]}`; };
const fmtLong = s => { const t = d(s); return `${ID_DAY[t.getUTCDay()]}, ${t.getUTCDate()} ${MON[t.getUTCMonth()]}`; };
/** Hari kerja berikutnya ke arah `dir`, atau null kalau sudah mentok. */
function stepWorkday(from, dir) {
  for (let d = addDays(from, dir), i = 0; i < 10; i++, d = addDays(d, dir)) {
    if (d > today() || d < FIRST_DAY) return null;
    if (isWorkday(d)) return d;
  }
  return null;
}

function pastWorkdays(end, n) {
  const out = []; for (let s = end; s >= FIRST_DAY && out.length < n; s = addDays(s,-1))
    if (isWorkday(s)) out.push(s);
  return out;
}

/* ---- numbers ------------------------------------------------------------- */
const num = v => { const n = parseFloat(v); return Number.isFinite(n) ? n : 0; };
const sumIn = (g,chans,c) => chans.reduce((s,ch) => s + num((g[ch.key]||{})[c]), 0);
function totalsIn(g, chans) {
  g = g || {};
  const open = sumIn(g,chans,"open"), gt3 = sumIn(g,chans,"gt3"), lt3 = sumIn(g,chans,"lt3");
  return { open, gt3, lt3, hanging:gt3+lt3, clear:open-gt3-lt3, reply:sumIn(g,chans,"reply") };
}
const totals = g => totalsIn(g, CHANNELS);
function lampAt(t, days) {
  if (t.gt3 > 0)     return { level:"red",   label:`Ada yang gantung lebih dari ${days} hari` };
  if (t.hanging > 0) return { level:"amber", label:"Masih ada yang gantung" };
  return { level:"green", label:"Tidak ada yang gantung" };
}
const lampFor = g => lampAt(totals(g), NDAYS);

/* Laporan yang sudah dikirim dibaca dengan channel dan ambang yang berlaku saat itu —
   kalau tidak, mengganti setelan hari ini diam-diam menulis ulang arti laporan kemarin. */
function docCfg(doc) {
  const snap = doc && doc.cfg;
  if (!snap || typeof snap !== "object") return CFG;
  const ch = (Array.isArray(snap.channels) ? snap.channels : []).filter(c => c && c.key)
    .map(c => ({ key:String(c.key), label:String(c.label || c.key),
                 full:String(c.full || c.label || c.key) }));
  return { ...CFG, channels: ch.length ? ch : CFG.channels,
           threshold_days: whole(snap.threshold_days, CFG.threshold_days, 1, 90) };
}
const docTotals = doc => totalsIn((doc || {}).grid, docCfg(doc).channels);
const docLamp = doc => lampAt(docTotals(doc), docCfg(doc).threshold_days);
const statusOf = (day, doc) =>
  doc && doc.submittedAt ? (doc.late ? "late" : "submitted") : (day < today() ? "missed" : "pending");

/* ---- state --------------------------------------------------------------- */
const S = { me:null, name:"", isLeader:false, cycles:new Map(), commitments:new Map(),
            roster:new Map(), tab:"hari-ini", step:1, editing:false, error:null,
            copied:false, showReport:false, ready:false, offline:false, a:null, savedAt:null,
            // Layar leader: hari yang sedang dibaca, dan laporan siapa yang dibuka.
            day:null, openRow:null,
            // Di mana orangnya: katalog modul, penjelasan sebuah modul, atau modulnya.
            view:"catalog", intro:false };

/* Penjelasan modul hanya muncul sekali per perangkat. Orang yang sudah paham tidak perlu
   membacanya tiap pagi; yang mau membacanya lagi punya tautan "Apa ini?" di atas. */
const SEEN = "fura.seen.";
function seenIntro(mod) {
  try { return localStorage.getItem(SEEN + mod) === "1"; } catch { return false; }
}
function markSeen(mod) {
  try { localStorage.setItem(SEEN + mod, "1"); } catch { /* mode privat */ }
}
/* Modul yang sedang dibuka disimpan per tab, bukan per perangkat. Memuat ulang di
   tengah pengisian harus kembali ke tempat yang sama — tapi besok pagi orangnya mulai
   dari katalog lagi, bukan dilempar ke modul kemarin. */
const AT = "fura.at";
const atStore = fn => { try { return fn(sessionStorage); } catch { return null; } };
function openModule(mod) {
  S.view = mod; S.intro = !seenIntro(mod); S.error = null;
  atStore(ss => ss.setItem(AT, mod));
  render(); toTop();
}
function goCatalog() {
  S.view = "catalog"; S.intro = false; S.error = null;
  atStore(ss => ss.removeItem(AT));
  render(); toTop();
}
/** Di mana tab ini tadi — kalau modulnya memang ada dan memang jalan. */
function resumeModule() {
  const at = atStore(ss => ss.getItem(AT));
  return MODULES.some(m => m.key === at && m.live) ? at : "catalog";
}

let db = null, users = null;
const key = (uid,day) => uid + "__" + day;
const mine = day => S.cycles.get(key(S.me, day));
const myPromises = () => [...S.commitments.values()]
  .filter(c => c.owner === S.me && c.status === "open").sort((a,b) => a.due.localeCompare(b.due));
const duePromises = () => myPromises().filter(c => c.due <= today());
const blank = () => ({ grid:{}, detail:"", plans:[{action:"",due:""}],
                       escalation:"", prista:"", declared:false });

/** Rencana sebagai daftar, apa pun bentuk simpanannya. Laporan dua minggu pertama
 *  memakai satu `plan` + `due`; dibaca di satu tempat supaya tetap terbuka utuh. */
function rawPlans(a) {
  a = a || {};
  const rows = Array.isArray(a.plans) ? a.plans
    : (a.plan || a.due) ? [{ action:a.plan || "", due:a.due || "" }] : [];
  return rows.filter(r => r && typeof r === "object")
             .map(r => ({ action:(r.action || "").trim(), due:(r.due || "").trim() }));
}

/** Yang disimpan dan divalidasi: baris kosong bukan rencana, jadi tidak dihitung. */
function plansOf(a) { return rawPlans(a).filter(r => r.action || r.due).slice(0, MAX_PLANS); }

/** Yang sedang diisi di layar. Beda dari plansOf: baris kosong dipertahankan — orang yang
 *  baru menekan "+ tambah rencana" harus melihat barisnya, bukan melihatnya hilang lagi. */
function planRows(a) {
  const rows = rawPlans(a).slice(0, MAX_PLANS);
  return rows.length ? rows : [{ action:"", due:"" }];
}

/* ---- drafts -------------------------------------------------------------- */
function saveDraft(day, a) {
  S.a = a; S.savedAt = nowHM();
  try { localStorage.setItem(DRAFT + day, JSON.stringify(a)); } catch { /* private mode */ }
}
function loadDraft(day) {
  try { const r = localStorage.getItem(DRAFT + day); return r ? JSON.parse(r) : null; } catch { return null; }
}
const clearDraft = day => { try { localStorage.removeItem(DRAFT + day); } catch { /* ignore */ } };

/* ---- data ---------------------------------------------------------------- */
async function boot() {
  try { db = await claude.use("db"); } catch { db = null; }
  try { users = await claude.use("user"); } catch { users = null; }
  if (users) {
    S.me = await users.id();
    const me = await users.me();
    S.name = (me && me.name) || "";
    S.isLeader = (users.isOwner && users.isOwner()) || false;
  }
  if (!S.me) { S.me = "local"; S.offline = true; S.name = S.name || "Kamu"; }

  if (db) {
    try {
      const [cy,cm,rs] = await Promise.all([ db.collection("cycles").get(),
        db.collection("commitments").get(), db.collection("roster").get() ]);
      cy.docs.forEach(s => S.cycles.set(s.id, { ...s.data() }));
      cm.docs.forEach(s => S.commitments.set(s.id, { ...s.data() }));
      rs.docs.forEach(s => S.roster.set(s.id, { ...s.data() }));
    } catch { S.offline = true; }
    if (!S.offline && !S.roster.has(S.me)) {
      const e = { name:S.name, joined:today() };
      S.roster.set(S.me, e);
      db.collection("roster").doc(S.me).set(e).catch(() => {});
    }
  } else { S.offline = true; }

  S.a = loadDraft(today()) || blank();
  S.view = resumeModule();
  S.ready = true;
  await names();
  render();
}
async function names() {
  if (!users || !users.profiles) return;
  const ids = [...S.roster.keys()].filter(i => i.startsWith("u_")).slice(0,64);
  if (!ids.length) return;
  try { const ps = await users.profiles(ids);
    ids.forEach(i => { const e = S.roster.get(i) || {};
      e.name = (ps[i] && ps[i].name) || e.name || ""; S.roster.set(i, e); });
  } catch { /* stored names stay */ }
}
const nameOf = u => (S.roster.get(u)||{}).name || (u === S.me ? (S.name || "Kamu") : "Seseorang");
const joinedOn = u => (S.roster.get(u)||{}).joined || FIRST_DAY;
/** Workdays this person did not report — never counting days before they joined. */
const missedDays = (uid, n) => pastWorkdays(addDays(today(),-1), n)
  .filter(dd => dd >= joinedOn(uid) && statusOf(dd, S.cycles.get(key(uid, dd))) === "missed");
const put = (c,i,doc) => { if (db && !S.offline) db.collection(c).doc(i).set({...doc}).catch(() => { S.offline = true; }); };

/* ---- steps --------------------------------------------------------------- */
function stepList() {
  const t = totals(S.a.grid);
  return t.hanging > 0 ? ["angka","gantung","kirim"] : ["angka","kirim"];
}
const stepName = () => stepList()[S.step - 1] || "kirim";

function checkStep() {
  const t = totals(S.a.grid);
  if (stepName() === "angka") {
    const typed = CHANNELS.some(c => COLS.some(k => (S.a.grid[c.key]||{})[k.key] !== undefined));
    if (!typed) return "Isi dulu angkanya. Kalau kosong semua, tulis 0.";
    if (t.hanging > t.open) return "Yang gantung lebih banyak daripada yang masih aktif. Cek lagi angkanya.";
  }
  if (stepName() === "gantung") {
    if (!S.a.detail.trim()) return Q.detail.error;
    const rows = plansOf(S.a);
    if (!rows.length) return Q.plan.error;
    for (const r of rows) {
      if (!r.action) return "Ada tanggal tanpa rencana. Tulis rencananya, atau hapus barisnya.";
      if (!r.due)    return Q.due.error;
    }
  }
  if (stepName() === "kirim" && !S.a.declared) return "Centang pernyataannya dulu.";
  return null;
}

function submitNow(resolved) {
  const day = today(), late = nowHour() >= DUE_AT;
  // Cuplikan setelan ikut tersimpan: laporan ini harus tetap terbaca seperti hari ini
  // walau pertanyaannya diubah bulan depan. Server menyimpan yang sama.
  const doc = { owner:S.me, day, ...S.a, cfg:{ channels:CHANNELS, threshold_days:NDAYS },
                submittedAt:new Date().toISOString(), late };
  S.cycles.set(key(S.me, day), doc);
  put("cycles", key(S.me, day), doc);
  for (const id of resolved) {
    const c = S.commitments.get(id);
    if (!c || c.status !== "open") continue;
    c.status = day <= c.due ? "kept" : "broken"; c.resolvedAt = day;
    put("commitments", id, c);
  }
  // Satu janji per baris rencana. Dicocokkan lewat teksnya, bukan urutannya — menghapus
  // baris pertama akan menggeser semua, dan janji orang jadi tertukar.
  const mineToday = [...S.commitments.values()]
    .filter(c => c.owner === S.me && c.from === day && c.status === "open");
  const wanted = plansOf(S.a).filter(r => r.action && r.due);
  for (const r of wanted) {
    const found = mineToday.find(c => c.action === r.action);
    if (found) { found.due = r.due; put("commitments", found.id, found); continue; }
    const id = "c-" + S.me + "-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 6);
    const c = { id, owner:S.me, action:r.action, due:r.due, status:"open", from:day };
    S.commitments.set(id, c); put("commitments", id, c);
  }
  for (const c of mineToday) {
    if (!wanted.some(r => r.action === c.action)) {
      c.status = "cancelled"; c.resolvedAt = day; put("commitments", c.id, c);
    }
  }
  clearDraft(day); S.editing = false; S.step = 1;
}

const esc = s => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const el = i => document.getElementById(i);
const view = el("view"), bar = el("bar"), barIn = el("barIn");

function progress() {
  const steps = stepList();
  return `<div class="prog">${steps.map((_,i) =>
    `<i class="${i < S.step ? "on" : ""}"></i>`).join("")}</div>
    <div class="stepno">LANGKAH ${S.step} DARI ${steps.length}</div>`;
}

function stepAngka() {
  const t = totals(S.a.grid), lamp = lampFor(S.a.grid);
  return `${progress()}
    <h1>${esc(Q.grid.label)}</h1>
    <p class="sub">${esc(Q.grid.hint)}</p>
    <div class="tbl">
      <table class="mx">
        <tr><th></th>${COLS.map(c => `<th>${c.head}</th>`).join("")}</tr>
        ${CHANNELS.map((ch,ri) => `<tr><td title="${esc(ch.full)}">${esc(ch.label)}</td>
          ${COLS.map((c,ci) => `<td><input type="text" inputmode="numeric" pattern="[0-9]*"
             enterkeyhint="${(ri === CHANNELS.length-1 && ci === COLS.length-1) ? "done" : "next"}"
             data-row="${ch.key}" data-col="${c.key}"
             aria-label="${esc(ch.label)} ${esc(c.head.replace(/<br>/g," "))}"
             value="${esc(((S.a.grid[ch.key]||{})[c.key]) ?? "")}"></td>`).join("")}
        </tr>`).join("")}
      </table>
      <div class="sumline">
        <div><b>${t.open}</b><span>masih aktif</span></div>
        <div class="${t.hanging ? "w" : ""}"><b>${t.hanging}</b><span>gantung</span></div>
        <div><b>${t.reply}</b><span>dibalas</span></div>
      </div>
      <p class="legend">Tiga angka ini dihitung sendiri. Kamu tidak perlu mengisinya.<br>Tekan <b>Enter</b> atau tombol panah untuk pindah kotak.</p>
    </div>
    <div class="lamp ${lamp.level}" style="margin-top:18px"><i></i>${esc(lamp.label)}</div>`;

function stepGantung() {
  const t = totals(S.a.grid), day = today(), rows = planRows(S.a);
  // Mulai dari satu baris. Orang dengan satu rencana harus melihat layar yang sama
  // persis seperti sebelumnya — baris kedua hanya ada kalau dia memintanya.
  const plan = (r, i) => `<div class="prow2" data-plan="${i}">
      <div class="fld">
        <label for="plan${i}">${esc(Q.plan.label)}</label>
        <textarea id="plan${i}" data-pa="${i}" rows="2"
          placeholder="${esc(Q.plan.placeholder)}">${esc(r.action)}</textarea>
      </div>
      <div class="fld">
        <label for="due${i}">${esc(Q.due.label)}</label>
        <input id="due${i}" data-pd="${i}" type="date" min="${esc(day)}" value="${esc(r.due)}">
      </div>
      ${rows.length > 1 ? `<button class="drop" type="button" data-drop="${i}"
        aria-label="Hapus rencana ini">✕</button>` : ""}

  return `${progress()}
    <h1>${t.hanging} yang masih gantung</h1>
    <p class="sub">Supaya tidak keskip, tiga hal ini perlu diisi.</p>
    <div class="fld">
      <label for="detail">${esc(Q.detail.label)}</label>
      <textarea id="detail" name="detail"
        placeholder="${esc(Q.detail.placeholder)}">${esc(S.a.detail)}</textarea>
    </div>
    <p class="hint" style="margin:0 0 10px">Tiap rencana punya tanggalnya sendiri. Nanti kamu
      diingatkan tepat di tanggal itu — bukan tiap hari.</p>
    ${rows.map(plan).join("")}
    ${rows.length < MAX_PLANS
      ? `<button class="addplan" type="button" id="addPlan">+ tambah rencana</button>` : ""}`;
}

function stepKirim() {
  const t = totals(S.a.grid), lamp = lampFor(S.a.grid);
  const row = (label, val, mono) => `<div><dt>${esc(label)}</dt>
    <dd class="${mono ? "n" : ""}">${esc(val)}</dd></div>`;
  return `${progress()}
    <h1>Cek sebentar</h1>
    <p class="sub">Kalau sudah benar, kirim. Nanti laporannya dibuatkan sendiri.</p>
    <div class="lamp ${lamp.level}"><i></i>${esc(lamp.label)}</div>
    <div class="rev">
      ${row("Masih aktif", `${t.open}  (${CHANNELS.map(c => `${num((S.a.grid[c.key]||{}).open)} ${c.label}`).join(", ")})`, true)}
      ${row("Gantung", t.hanging === 0 ? "tidak ada" : `${t.hanging}  (${t.gt3} lebih dari 3 hari)`, true)}
      ${row("Dibalas", String(t.reply), true)}
      ${t.hanging > 0 ? row("Yang gantung", S.a.detail) : ""}
      ${t.hanging > 0 ? plansOf(S.a).filter(r => r.action).map((r, i) =>
          row(i === 0 ? "Rencana" : "", r.action + (r.due ? ` — ${fmt(r.due)}` : ""))).join("") : ""}
      <div><dt></dt><dd><button class="edit" type="button" data-goto="1">Ubah angka</button></dd></div>
    </div>
    ${(() => { const due = duePromises(), day = today(); return due.length
      ? `<h2>Janji kamu</h2>` + due.map(c => `
        <label class="check"><input type="checkbox" data-resolve="${esc(c.id)}">
          <span class="t"><span class="strong">${esc(c.action)}</span><br>
          <span class="meta">janji ${esc(fmt(c.due))}${
            c.due < day ? " · sudah lewat" : ""} — sudah beres?</span>
          </span></label>`).join("")
      : ""; })()}
    ${Q.escalation.show ? `<div class="fld"><label for="escalation">${esc(Q.escalation.label)}
      <span class="opt">— boleh dikosongkan</span>
      <span class="hint">${esc(Q.escalation.hint)}</span></label>
      <textarea id="escalation" name="escalation"
        placeholder="${esc(Q.escalation.placeholder)}">${esc(S.a.escalation)}</textarea></div>` : ""}
    ${Q.prista.show ? `<div class="fld"><label for="prista">${esc(Q.prista.label)}
      <span class="opt">— boleh dikosongkan</span></label>
      <textarea id="prista" name="prista"
        placeholder="${esc(Q.prista.placeholder)}">${esc(S.a.prista)}</textarea></div>` : ""}
    <label class="check decl"><input type="checkbox" name="declared" ${S.a.declared ? "checked" : ""}>
      <span class="t">${esc(DECLARATION)}</span></label>`;
}

function buildReport(doc) {
  const c = docCfg(doc), days = c.threshold_days;
  const t = totalsIn(doc.grid, c.channels), lamp = lampAt(t, days), g = doc.grid || {};
  const tag = { green:"[HIJAU]", amber:"[KUNING]", red:"[MERAH]" }[lamp.level];
  const ln = (k,v) => `${k}: ${(v||"").toString().trim() || "Belum ada"}`;
  const lines = ["MESSI Report", "Date: " + fmt(doc.day) + " (" + doc.day + ")",
    (CFG.team_name ? "Tim: " + CFG.team_name + "   " : "") + "Report by: " + nameOf(doc.owner),
    "", tag + " " + lamp.label, "",
    "a. Channel aktif/open: " + c.channels.map(x => `${num((g[x.key]||{}).open)} ${x.label}`).join(", "),
    `b. Gantung >${days} hari: ` + t.gt3, `c. Gantung <${days} hari: ` + t.lt3,
    "d. Tidak gantung: " + t.clear, "e. Sudah dibalas hari ini: " + t.reply,
    ln("f. Yang masih gantung", doc.detail),
    (() => {
      const rows = plansOf(doc).filter(r => r.action)
        .map(r => r.action + (r.due ? ` (target ${fmt(r.due)})` : ""));
      // Satu rencana tetap satu baris, persis laporan yang sudah dikenal timnya.
      return rows.length > 1 ? "g. Rencana:\n- " + rows.join("\n- ")
                             : ln("g. Rencana", rows[0] || "");
    })()];
  // Pertanyaan yang dimatikan tidak muncul sebagai "Belum ada" — itu bukan jawaban
  // kosong, pertanyaannya memang tidak pernah diajukan.
  if (Q.escalation.show) lines.push(ln("h. Eskalasi", doc.escalation));
  if (Q.prista.show)     lines.push(ln("i. Calon project baru", doc.prista));
  lines.push("", "Deklarasi: " + DECLARATION);
  return lines.join("\n");
}

function screenDone(doc) {
  const t = docTotals(doc), lamp = docLamp(doc);
  return `<div class="done">
      <div class="tick">✓</div>
      <h1>Sudah terkirim</h1>
      <p class="sub">${esc(fmtLong(doc.day))}${doc.late ? ` · setelah jam ${hhmm(DUE_AT)}` : ""}</p>
    </div>
    <div class="lamp ${lamp.level}"><i></i>${esc(lamp.label)}</div>
    <div class="rev">
      <div><dt>Masih aktif</dt><dd class="n">${t.open}</dd></div>
      <div><dt>Gantung</dt><dd class="n">${t.hanging === 0 ? "tidak ada" : t.hanging}</dd></div>
      <div><dt>Dibalas</dt><dd class="n">${t.reply}</dd></div>
    </div>
    ${S.showReport ? `<div class="report" id="reportText">${esc(buildReport(doc))}</div>` : ""}
    <button class="fix" type="button" id="edit">Ada yang salah? Perbaiki laporannya</button>
    ${myPromises().length ? `<h2>Yang kamu janjikan</h2>` + myPromises().map(c => `
      <div class="card ${c.due < today() ? "bad" : "due"}"><div class="row">
        <span class="strong">${esc(c.action)}</span><span class="grow"></span>
        <span class="meta">${esc(fmt(c.due))}</span></div></div>`).join("") : ""}
    ${recent()}`;
}

function recent() {
  const days = pastWorkdays(addDays(today(),-1), 4);
  if (!days.length) return "";
  return `<h2>Beberapa hari lalu</h2>` + days.map(day => {
    const doc = S.cycles.get(key(S.me, day)), st = statusOf(day, doc);
    const t = doc ? docTotals(doc) : null;
    return `<div class="card ${st === "missed" ? "bad" : ""}"><div class="row">
      <span class="strong">${esc(fmt(day))}</span><span class="grow"></span>
      <span class="meta">${st === "missed" ? "tidak lapor"
        : t.hanging === 0 ? "aman" : t.hanging + " gantung"}${st === "late" ? " · telat" : ""}</span>
    </div></div>`;
  }).join("");
}

/**
 * Katalog modul — layar pertama.
 *
 * Bukan sekadar pintu. Kartu modul yang hidup membawa keadaannya hari ini, jadi orang
 * yang membuka FURA sudah tahu apa yang menunggu sebelum menekan apa pun. Pintu yang
 * hanya pintu cuma menambah satu ketukan tiap pagi.
 */
function screenCatalog() {
  const day = today();
  const state = () => {
    if (!isWorkday(day)) return { cls:"", text:"Hari ini libur" };
    const doc = mine(day);
    if (doc && doc.submittedAt) return { cls:"done", text:"Sudah lapor hari ini" };
    if (nowHour() < OPEN_AT) return { cls:"", text:`Dibuka jam ${hhmm(OPEN_AT)}` };
    const late = myPromises().filter(c => c.due <= day).length;
    return { cls:"todo", text:"Belum lapor hari ini"
      + (late ? ` · ${late} janji jatuh tempo` : "") };
  };
  const leader = () => {
    if (!S.isLeader || !isWorkday(day)) return "";
    const people = [...S.roster.keys()].filter(u => day >= joinedOn(u));
    const done = people.filter(u => {
      const c = S.cycles.get(key(u, day)); return c && c.submittedAt;
    }).length;
    return `<div class="state"><i></i>Tim: ${done}/${people.length} sudah lapor</div>`;
  };

  return `<h1>Modul</h1>
    <p class="sub">Pilih yang mau kamu kerjakan.</p>
    <div class="mods">
      ${MODULES.map(m => {
        if (!m.live) return `<div class="mod soon">
          <div class="head"><span class="name">${esc(m.name)}</span>
            <span class="full">${esc(m.full)}</span><span class="pill">segera</span></div>
          <p>${esc(m.what)}</p></div>`;
        const st = state();
        return `<button class="mod" type="button" data-mod="${esc(m.key)}">
          <div class="head"><span class="name">${esc(m.name)}</span>
            <span class="full">${esc(m.full)}</span><span class="pill">aktif</span></div>
          <p>${esc(m.what)}</p>
          <div class="state ${st.cls}"><i></i>${esc(st.text)}</div>
          ${leader()}
        </button>`;
      }).join("")}
    </div>`;
}

/**
 * Apa itu MESSI, untuk orang yang baru pertama membukanya.
 *
 * Isinya dibangun dari setelan yang berlaku, bukan ditulis ulang di sini: kalau admin
 * memindahkan batas ke 1 hari atau menutup jam 17, penjelasannya ikut — penjelasan yang
 * berbeda dari aplikasinya lebih buruk daripada tidak ada penjelasan.
 */
function screenIntro() {

    <h2>Yang kamu isi</h2>

    </ol>

    <h2>Setelah dikirim</h2>
    <ul>

      <li>Gantung lebih dari ${NDAYS} hari membuat laporannya merah.</li>

function screenPlayer() {
  const day = today(), doc = mine(day), st = statusOf(day, doc);

  if (!isWorkday(day)) return `<div class="blank"><b>Hari ini libur.</b>
    MESSI diisi Senin sampai Jumat. Sampai ketemu Senin pagi.</div>` + recent();
  if (nowHour() < OPEN_AT && !doc) return `<div class="blank"><b>Belum dibuka.</b>
    Pengisian dibuka jam ${hhmm(OPEN_AT)}. Nanti ada pesan pengingat.</div>` + recent();

  if (st === "pending" || S.editing) {
    const n = stepName();
    const body = n === "angka" ? stepAngka() : n === "gantung" ? stepGantung() : stepKirim();
    if (n !== "angka") return body;
    const gaps = missedDays(S.me, 5);
    if (!gaps.length) return body;
    return `<div class="miss">Kamu belum lapor ${esc(gaps.map(fmt).join(" dan "))}.
      Yang lewat tidak bisa diisi lagi — mulai dari hari ini.</div>` + body;
  }
  return screenDone(doc);
}

/**
 * Rekap tim — ini yang dibaca atasan.
 *
 * Dulu rekap ini dikirim sebagai pesan jam 18:00, dan sebelum itu lagi orang menempel
 * laporan lengkapnya ke grup. Begitu keduanya hilang, layar ini yang menggantikan: bukan
 * daftar masalah saja, tapi semua orang beserta angkanya — dan laporan utuh siapa pun
 * bisa dibuka dengan satu ketukan, seperti dulu terbaca di grup.
 */
function screenLeader() {
  const day = S.day || today();
  const people = [...S.roster.keys()].filter(uid => day >= joinedOn(uid));
  const rows = people.map(uid => {
    const doc = S.cycles.get(key(uid, day));
    return { uid, doc, st: statusOf(day, doc), missed: missedDays(uid, 5).length };
  });
  rows.sort((a, b) => nameOf(a.uid).localeCompare(nameOf(b.uid)));

  const done = rows.filter(r => r.doc && r.doc.submittedAt);
  const waiting = rows.filter(r => !(r.doc && r.doc.submittedAt));
  const late = [...S.commitments.values()]
    .filter(c => c.status === "open" && c.due < today());

  /* ---- kepala: hari apa yang sedang dibaca ---- */
  const prev = stepWorkday(day, -1), next = stepWorkday(day, 1);
  const nav = `<div class="daynav">
    ${prev ? `<button type="button" data-day="${prev}">‹ ${esc(fmt(prev))}</button>`
           : `<span></span>`}
    <b>${esc(fmtLong(day))}${day === today() ? "" : ""}</b>
    ${next ? `<button type="button" data-day="${next}">${esc(fmt(next))} ›</button>`
           : `<span></span>`}
  </div>`;

  let html = `<h1>Rekap tim</h1>
    <p class="sub">${people.length} orang${day === today() ? " · hari ini" : ""}</p>
    ${nav}
    <div class="stats">
      <div class="g"><b>${done.length}/${people.length}</b><span>sudah lapor</span></div>
      <div class="${late.length ? "r" : ""}"><b>${late.length}</b><span>janji lewat</span></div>
      <div class="${waiting.length ? "r" : ""}"><b>${waiting.length}</b><span>belum lapor</span></div>
    </div>`;

  /* ---- yang butuh tindakan, tetap di atas ---- */
  const cards = [];
  rows.filter(r => r.doc && (r.doc.escalation || "").trim()).forEach(r => cards.push(
    `<div class="card due"><div class="row"><span class="strong">${esc(nameOf(r.uid))}</span>
      <span class="grow"></span><span class="meta">minta bantuan</span></div>
      <div style="margin-top:6px">${esc(r.doc.escalation)}</div></div>`));
  late.forEach(c => cards.push(
    `<div class="card bad"><div class="row"><span class="strong">${esc(nameOf(c.owner))}</span>
      <span class="grow"></span><span class="meta">janji ${esc(fmt(c.due))} lewat</span></div>
      <div style="margin-top:6px">${esc(c.action)}</div></div>`));
  // Hanya yang memang belum lapor hari ini. Orang yang sudah mengisi bukan masalah
  // hari ini — riwayatnya tetap kelihatan, tapi sebagai catatan kecil di barisnya,
  // bukan kartu merah yang menenggelamkan eskalasi yang sungguhan.
  rows.filter(r => r.missed >= 2 && !(r.doc && r.doc.submittedAt)).forEach(r => cards.push(
    `<div class="card bad"><div class="row"><span class="strong">${esc(nameOf(r.uid))}</span>
      <span class="grow"></span><span class="meta">${r.missed} hari</span></div>
      <div style="margin-top:6px">Belum lapor beberapa hari.</div></div>`));
  // Dua kolom di laptop, bertumpuk di telepon — pembungkusnya sama, CSS yang memutuskan.
  html += `<div class="cols"><div class="col">`;
  html += cards.length ? `<h2>Perlu perhatian</h2>` + cards.join("")
    : `<div class="blank" style="margin-top:4px"><b>Tidak ada yang perlu dibaca.</b>
       Tidak ada yang minta bantuan, tidak ada janji lewat.</div>`;

  /* ---- semua orang, dengan angkanya ---- */
  html += `</div><div class="col">`;
  html += `<h2>Semua (${people.length})</h2>` + rows.map(r => {
    const open = S.openRow === r.uid;
    if (!r.doc || !r.doc.submittedAt) {
      return `<div class="card"><div class="row">
        <span class="pip off"></span><span class="strong">${esc(nameOf(r.uid))}</span>
        <span class="grow"></span><span class="meta">${
          r.st === "missed" ? "tidak lapor" : "belum lapor"}</span></div></div>`;
    }
    const t = docTotals(r.doc), lamp = docLamp(r.doc);
    return `<div class="card">
      <button class="prow" type="button" data-open="${esc(r.uid)}">
        <span class="pip ${lamp.level}"></span>
        <span class="strong">${esc(nameOf(r.uid))}</span>
        <span class="grow"></span>
        <span class="meta">${t.open} aktif · ${
          t.hanging === 0 ? "aman" : t.hanging + " gantung"}${
          r.doc.late ? " · telat" : ""}${
          r.missed >= 2 ? ` · ${r.missed} hari terlewat` : ""}</span>
        <span class="chev">${open ? "▾" : "›"}</span>
      </button>
      ${open ? `<div class="report">${esc(buildReport(r.doc))}</div>` : ""}
    </div>`;
  }).join("");

  return html + `</div></div>`;
}

function renderBar() {
  const day = today(), doc = mine(day), st = statusOf(day, doc);
  if (S.view === "catalog" || S.intro) { bar.hidden = true; return; }
  if (S.tab === "tim") { bar.hidden = true; return; }
  if (!isWorkday(day) || (nowHour() < OPEN_AT && !doc)) { bar.hidden = true; return; }

  bar.hidden = false;
  const err = S.error ? `<div class="err">${esc(S.error)}</div>` : "";

  if (st === "pending" || S.editing) {
    const steps = stepList(), last = S.step >= steps.length;
    barIn.innerHTML = err + `<div class="btns">
      ${S.step > 1 ? `<button class="btn sec" type="button" id="back">Kembali</button>` : ""}
      <button class="btn" type="button" id="next">${last ? "Kirim laporan" : "Lanjut"}</button>
      </div>${S.savedAt ? `<div class="saved">Tersimpan otomatis ${esc(S.savedAt)}</div>` : ""}`;
    if (el("back")) el("back").addEventListener("click", () => { S.step--; S.error = null; render(); toTop(); });
    el("next").addEventListener("click", onNext);
  } else {
    barIn.innerHTML = `<div class="btns">
      <button class="btn" type="button" id="toggle">${S.showReport ? "Tutup laporan" : "Lihat laporan"}</button>
      <button class="btn sec" type="button" id="copy">${S.copied ? "Tersalin ✓" : "Salin"}</button>
      </div>`;
    el("copy").addEventListener("click", onCopy);
    el("toggle").addEventListener("click", () => { S.showReport = !S.showReport; render(); });
  }
}

function render() {
  el("whenLbl").textContent = S.ready ? `${fmt(today())} · ${nowHM()}` : "…";
  const av = el("avatar");
  av.textContent = (S.name || "?").trim().charAt(0).toUpperCase() || "?";
  av.title = S.name || "";
  if (!S.ready) { view.innerHTML = `<div class="blank">Sebentar…</div>`; return; }

  const inModule = S.view !== "catalog";
  const mod = MODULES.find(m => m.key === S.view);

  const modbar = el("modbar");
  modbar.hidden = !inModule;
  if (inModule) {
    el("modbarIn").innerHTML =
      `<button class="back" type="button" data-home>‹ Modul</button>
       <b>${esc(mod ? mod.name : S.view.toUpperCase())}</b>
       ${S.intro ? "" : `<button class="what" type="button" id="what">Apa ini?</button>`}`;
  }

  const tabs = el("tabs");
  if (S.isLeader && inModule && !S.intro) {
    tabs.hidden = false;
    const late = [...S.commitments.values()].filter(c => c.status === "open" && c.due < today()).length;
    tabs.innerHTML =
      `<button role="tab" data-tab="hari-ini" aria-selected="${S.tab === "hari-ini"}">Punya saya</button>
       <button role="tab" data-tab="tim" aria-selected="${S.tab === "tim"}">Tim${
         late ? `<span class="n">${late}</span>` : ""}</button>`;
  } else tabs.hidden = true;

  let body = !inModule ? screenCatalog()
    : S.intro ? screenIntro()
    : (S.tab === "tim" && S.isLeader) ? screenLeader() : screenPlayer();
  if (S.offline) body += `<p class="note">Tersimpan di HP ini saja untuk sekarang.
    Isian kamu aman dan tidak hilang.</p>`;
  view.innerHTML = body;
  renderBar();
}

const toTop = () => window.scrollTo({ top:0, behavior:"smooth" });

/** Reopens a report that was already sent. The server accepts it as a correction to the
 *  same day rather than a second report, and moves the promise instead of adding one. */
function reopen() {
  const doc = mine(today());
  if (!doc) return;
  S.a = { grid:JSON.parse(JSON.stringify(doc.grid || {})), detail:doc.detail || "",
          plans:planRows(doc), escalation:doc.escalation || "",
          prista:doc.prista || "", declared:false };
  S.editing = true; S.step = 1; S.error = null; S.showReport = false;
  saveDraft(today(), S.a); render(); toTop();
}

/* ---- events -------------------------------------------------------------- */
function collect() {
  const g = {};
  view.querySelectorAll("[data-row]").forEach(i => {
    if (i.value === "") return;
    (g[i.dataset.row] || (g[i.dataset.row] = {}))[i.dataset.col] = num(i.value);
  });
  const val = n => { const e = view.querySelector(`[name=${n}]`); return e ? e.value : undefined; };
  const a = { ...S.a };
  if (view.querySelector("[data-row]")) a.grid = g;
  ["detail","escalation","prista"].forEach(n => {
    const v = val(n); if (v !== undefined) a[n] = v;
  });
  if (view.querySelector("[data-plan]")) {
    a.plans = [...view.querySelectorAll("[data-plan]")].map(el => ({
      action: (el.querySelector("[data-pa]") || {}).value || "",
      due:    (el.querySelector("[data-pd]") || {}).value || "",
    }));
  }
  const dc = view.querySelector("[name=declared]");
  if (dc) a.declared = dc.checked;
  return a;
}

function onNext() {
  S.a = collect();
  saveDraft(today(), S.a);
  const err = checkStep();
  S.error = err;
  if (err) { render(); toTop(); return; }

  const steps = stepList();
  if (S.step >= steps.length) {
    const resolved = [...view.querySelectorAll("[data-resolve]")].filter(i => i.checked)
      .map(i => i.dataset.resolve);
    submitNow(resolved);
  } else S.step++;
  render(); toTop();
}

function onCopy() {
  const doc = mine(today());
  if (!doc) return;
  const text = buildReport(doc);
  const ok = () => { S.copied = true; render(); setTimeout(() => { S.copied = false; render(); }, 2200); };
  const fall = () => { S.showReport = true; render();
    const n = el("reportText"); if (!n) return;
    const r = document.createRange(); r.selectNodeContents(n);
    const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); };
  try { navigator.clipboard.writeText(text).then(ok, fall); } catch { fall(); }
}

// Logo dan "‹ Modul" sama-sama jalan pulang; "Apa ini?" membuka penjelasannya lagi.
el("home").addEventListener("click", goCatalog);
el("modbar").addEventListener("click", ev => {
  if (ev.target.closest("[data-home]")) { goCatalog(); return; }
  if (ev.target.id === "what") { S.intro = true; render(); toTop(); }
});

el("tabs").addEventListener("click", ev => {
  const b = ev.target.closest("[data-tab]");
  if (!b) return;
  S.tab = b.dataset.tab; S.error = null;
  S.day = null; S.openRow = null;          // tiap masuk tab Tim, mulai dari hari ini
  render(); toTop();
});

view.addEventListener("click", ev => {
  const g = ev.target.closest("[data-goto]");
  if (!g) return;
  S.a = collect(); saveDraft(today(), S.a);
  S.step = parseInt(g.dataset.goto, 10); S.error = null; render(); toTop();
});

// Selecting on focus means tapping a cell and typing replaces the number, instead of
// dropping the caret mid-digit and turning 13 into 173.
view.addEventListener("click", ev => {
  const card = ev.target.closest && ev.target.closest("[data-mod]");
  if (card) { openModule(card.dataset.mod); return; }
  if (ev.target && ev.target.id === "introGo") {
    markSeen(S.view); S.intro = false; render(); toTop(); return;
  }
  if (ev.target && ev.target.id === "edit") { reopen(); return; }
  if (ev.target && ev.target.id === "addPlan") {
    S.a = collect();
    S.a.plans = planRows(S.a).concat([{ action:"", due:"" }]).slice(0, MAX_PLANS);
    saveDraft(today(), S.a); render();
    const last = [...view.querySelectorAll("[data-pa]")].pop();
    if (last) last.focus();
    return;
  }
  const drop = ev.target.closest && ev.target.closest("[data-drop]");
  if (drop) {
    S.a = collect();
    const i = +drop.dataset.drop, rows = planRows(S.a).filter((_, n) => n !== i);
    S.a.plans = rows.length ? rows : [{ action:"", due:"" }];
    saveDraft(today(), S.a); render();
    return;
  }
  const day = ev.target.closest && ev.target.closest("[data-day]");
  if (day) { S.day = day.dataset.day; S.openRow = null; render(); toTop(); return; }
  const row = ev.target.closest && ev.target.closest("[data-open]");
  if (row) { const u = row.dataset.open; S.openRow = S.openRow === u ? null : u; render(); }
});
view.addEventListener("focusin", ev => {
  if (ev.target.dataset && ev.target.dataset.row) ev.target.select();
});

/** Grid keys: Enter and the arrows move between cells instead of changing numbers. */
view.addEventListener("keydown", ev => {
  const t = ev.target;
  if (!t.dataset || !t.dataset.row) return;
  const cells = [...view.querySelectorAll("[data-row]")];
  const i = cells.indexOf(t), wide = COLS.length;
  let to = null;
  if (ev.key === "ArrowUp")         to = i - wide;
  else if (ev.key === "ArrowDown")  to = i + wide;
  else if (ev.key === "Enter")      to = i + 1;
  else if (ev.key === "ArrowLeft"  && t.selectionStart === 0) to = i - 1;
  else if (ev.key === "ArrowRight" && t.selectionStart === t.value.length) to = i + 1;
  else return;
  ev.preventDefault();
  if (to >= 0 && to < cells.length) { cells[to].focus(); cells[to].select(); }
  else if (ev.key === "Enter" && el("next")) el("next").focus();
});

// Scrolling the page must never change a number the person already typed.
view.addEventListener("wheel", ev => {
  const a = document.activeElement;
  if (a && a.dataset && a.dataset.row && a.contains(ev.target)) a.blur();
}, { passive:true });

view.addEventListener("input", ev => {
  if (ev.target.dataset && ev.target.dataset.row) {
    const clean = ev.target.value.replace(/[^0-9]/g, "");
    if (clean !== ev.target.value) {
      const at = ev.target.selectionStart - (ev.target.value.length - clean.length);
      ev.target.value = clean;
      try { ev.target.setSelectionRange(at, at); } catch { /* ignore */ }
    }
  }
  if (!ev.target.matches("[data-row],[name],textarea,input")) return;
  S.a = collect();
  saveDraft(today(), S.a);
  if (!ev.target.dataset.row) return;
  // Update only the three tiles and the lamp — rebuilding would steal the keyboard.
  const t = totals(S.a.grid), l = lampFor(S.a.grid);
  const sl = view.querySelector(".sumline");
  if (sl) sl.innerHTML = `<div><b>${t.open}</b><span>masih aktif</span></div>
    <div class="${t.hanging ? "w" : ""}"><b>${t.hanging}</b><span>gantung</span></div>
    <div><b>${t.reply}</b><span>dibalas</span></div>`;
  const lp = view.querySelector(".lamp");
  if (lp) { lp.className = "lamp " + l.level; lp.innerHTML = "<i></i>" + esc(l.label); }
});

render();
applyTheme();
el("theme").addEventListener("click", toggleTheme);
boot();
</script>
